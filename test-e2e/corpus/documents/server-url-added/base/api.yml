openapi: 3.2.0
info:
  title: Shipping API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production, US region.
paths:
  /shipments/{shipmentId}:
    get:
      operationId: getShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The shipment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
