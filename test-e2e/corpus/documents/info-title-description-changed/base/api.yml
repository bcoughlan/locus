openapi: 3.1.0
info:
  title: Pet Store
  version: 2.0.0
  description: Manage the pets of one store.
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
