openapi: 3.0.3
info:
  title: Pet Store
  version: 1.3.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
        '404':
          description: No pet has this ID.
