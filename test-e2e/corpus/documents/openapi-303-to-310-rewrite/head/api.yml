openapi: 3.1.0
info:
  title: Pet Store
  version: 3.0.0
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: minWeight
          in: query
          schema:
            type: number
            exclusiveMinimum: 0
      responses:
        '200':
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nickname:
          type: [string, 'null']
        weight:
          type: number
          exclusiveMinimum: 0
        owner:
          type: [object, 'null']
          properties:
            name:
              type: string
