openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petId]
              properties:
                petId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: The order was created.
