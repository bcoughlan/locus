openapi: 3.1.0
info:
  title: Reporting API
  version: 1.0.0
paths:
  /reports:
    get:
      operationId: listReports
      security:
        - apiKey: []
      responses:
        '200':
          description: A list of reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
