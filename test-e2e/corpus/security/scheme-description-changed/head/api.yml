openapi: 3.2.0
info:
  title: Inventory API
  version: 4.0.0
security:
  - apiKey: []
paths:
  /items/{sku}:
    get:
      operationId: getItem
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku:
                    type: string
                  quantity:
                    type: integer
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: A key from the developer portal. Each key belongs to one team.
