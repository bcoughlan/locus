openapi: 3.1.0
info:
  title: Orders API
  version: 2.3.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  total:
                    type: number
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
