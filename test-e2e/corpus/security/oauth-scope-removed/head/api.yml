openapi: 3.0.3
info:
  title: Pet Store
  version: 1.2.0
paths:
  /pets:
    get:
      operationId: listPets
      security:
        - petAuth: [pets:read]
      responses:
        '200':
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
components:
  securitySchemes:
    petAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://auth.example.com/authorize
          scopes:
            pets:read: Read pets.
            pets:write: Create, change, and delete pets.
