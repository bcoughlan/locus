openapi: 3.2.0
info:
  title: Reporting API
  version: 2.0.0
paths:
  /reports:
    get:
      operationId: listReports
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: A list of reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
