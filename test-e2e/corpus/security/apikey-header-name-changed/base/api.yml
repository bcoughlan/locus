openapi: 3.0.3
info:
  title: Weather API
  version: 1.5.0
security:
  - apiKey: []
paths:
  /forecasts/{city}:
    get:
      operationId: getForecast
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The forecast for the city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  temperature:
                    type: number
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
