openapi: 3.1.0
info:
  title: Pet Store
  version: 1.2.0
paths:
  /pets/{petId}:
    delete:
      operationId: deletePet
      security:
        - petAuth: [pets:write]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The pet was deleted.
components:
  securitySchemes:
    petAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            pets:read: Read pets.
            pets:write: Create, change, and delete pets.
            pets:admin: Manage all pets of the store.
