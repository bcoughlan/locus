openapi: 3.1.0
info:
  title: News API
  version: 1.0.0
paths:
  /articles:
    get:
      operationId: listArticles
      description: Anonymous callers see public articles. Signed-in callers also see articles for subscribers.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    headline:
                      type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
