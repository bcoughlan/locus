openapi: 3.1.0
info:
  title: Maps API
  version: 3.0.0
paths:
  /geocode:
    get:
      operationId: geocode
      security:
        - apiKey: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The coordinates of the address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lat:
                    type: number
                  lng:
                    type: number
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: api_key
