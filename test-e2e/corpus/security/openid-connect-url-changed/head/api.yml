openapi: 3.1.0
info:
  title: Projects API
  version: 2.0.0
security:
  - oidc: [openid, profile]
paths:
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://id.example.com/realms/main/.well-known/openid-configuration
