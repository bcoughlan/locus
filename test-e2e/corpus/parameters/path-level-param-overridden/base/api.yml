openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets:
    parameters:
      - name: format
        in: query
        required: false
        description: The format of the response.
        schema:
          type: string
          enum: [full, compact]
    get:
      operationId: listPets
      summary: List pets
      responses:
        '200':
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
