openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /owners/{ownerId}/pets:
    get:
      operationId: listOwnerPets
      summary: List the pets of an owner
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: X-Fields
          in: header
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
