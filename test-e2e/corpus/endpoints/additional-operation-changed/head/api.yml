openapi: 3.2.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getPet
      summary: Get one pet
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    additionalOperations:
      COPY:
        operationId: copyPet
        summary: Copy a pet
        description: Without a Destination header, the server picks a new ID.
        parameters:
          - name: Destination
            in: header
            required: true
            schema:
              type: string
        responses:
          '201':
            description: The copy of the pet.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
