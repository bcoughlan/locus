openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets/{petId}:
    $ref: '#/components/pathItems/PetItem'
components:
  pathItems:
    PetItem:
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      get:
        operationId: getPet
        summary: Get one pet
        responses:
          '200':
            description: The pet.
            content:
              application/json:
                schema:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
