openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets/{petId}:
    delete:
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The pet is deleted.
        '404':
          description: No pet has this ID.
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
