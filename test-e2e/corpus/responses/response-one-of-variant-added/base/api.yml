openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: No pet has this ID.
components:
  schemas:
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Cat'
    Dog:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          const: dog
        name:
          type: string
        barks:
          type: boolean
    Cat:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          const: cat
        name:
          type: string
        indoor:
          type: boolean
