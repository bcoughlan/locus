openapi: 3.0.3
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '301':
          description: The pet moved to a new ID.
          headers:
            Location:
              description: The URL of the pet.
              schema:
                type: string
        '404':
          description: No pet has this ID.
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
