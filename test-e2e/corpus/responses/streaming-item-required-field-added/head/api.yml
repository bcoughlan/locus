openapi: 3.2.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets/feed:
    get:
      operationId: streamPets
      summary: Stream all pets as JSON Lines
      responses:
        '200':
          description: One JSON object per line, one line per pet.
          content:
            application/jsonl:
              itemSchema:
                type: object
                required:
                  - id
                  - name
                  - updatedAt
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
