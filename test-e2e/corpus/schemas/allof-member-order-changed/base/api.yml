openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: The pet was created.
components:
  schemas:
    PetBase:
      type: object
      required: [name]
      properties:
        name:
          type: string
    PetExtras:
      type: object
      properties:
        tag:
          type: string
        birthDate:
          type: string
          format: date
    NewPet:
      allOf:
        - $ref: '#/components/schemas/PetBase'
        - $ref: '#/components/schemas/PetExtras'
