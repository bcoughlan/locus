openapi: 3.1.0
info:
  title: Pets API
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: The pet was created.
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        size:
          type: string
          enum: [small, medium, large, giant]
